apiVersion: v1
kind: Service
metadata:
  name: flask-message-board-service
  labels:
    app: flask-message-board
spec:
  type: {{ .Values.service.type }}
  selector:
    app: flask-message-board
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      